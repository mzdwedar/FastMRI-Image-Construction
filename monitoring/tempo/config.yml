# Single-binary Tempo, local backend, 3 day retention, metrics-generator off (SPEC-observability "Stack").
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317   # Alloy exports here after tail sampling; nothing else sends to Tempo

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h           # 3 d

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
