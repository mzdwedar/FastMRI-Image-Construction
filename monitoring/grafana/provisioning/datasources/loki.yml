apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # log line -> trace: the access log's trace_id field opens the trace in Tempo
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id": "(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: Open trace
