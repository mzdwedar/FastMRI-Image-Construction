apiVersion: 1
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    orgId: 1
    url: http://tempo:3200
    jsonData:
      # trace -> logs: the gateway's JSON lines carry trace_id (a field, not a label)
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service="gateway"} | json | trace_id="$${__trace.traceId}"'
      # trace -> metrics: request rate and p95 of the gateway around the trace
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        queries:
          - name: Gateway request rate
            query: 'sum by (route) (rate(gateway_requests_total[1m]))'
          - name: Gateway p95 latency
            query: 'histogram_quantile(0.95, sum by (le, route) (rate(gateway_request_duration_seconds_bucket[1m])))'
      nodeGraph:
        enabled: true
