trainer:
  gpus: 1
  seeds: 42
  log_every_n_steps: 1
  accelerator: ${oc.env:accelerator, auto}
  source: ${oc.env:run_source, local}  # recorded in run_summary.json; the Colab notebook sets colab
  MLFLOW_TRACKING_URI: ${oc.env:MLFLOW_TRACKING_URI, "file:./mlruns"}
  TRAIN_RESULTS_FILE: ${oc.env:TRAIN_RESULTS_FILE, ""}
  EVAL_RESULTS_FILE: ${oc.env:EVAL_RESULTS_FILE, ""}
  run_id: ${oc.env:run_id, ""}
  PREDICTIONS_DIR: ${oc.env:PREDICTIONS_DIR, data/outputs/${trainer.run_id}/}

  train:
    experiment_name: ${oc.env:experiment_name, fastmri}
    max_epochs: ${oc.decode:${oc.env:max_epochs, 1}}
    max_steps: ${oc.decode:${oc.env:max_steps, -1}}
    strategy: auto
    results_fp: ""
    metric: psnr
    batch_size: ${oc.decode:${oc.env:batch_size, 16}}

    optimizer:
      lr: 1e-3
      weight_decay: 1e-6
      name: Adam

    scheduler:
      name: "ReduceLROnPlateau"
      params:
        mode: "min"
        factor: 0.1
        patience: 5
      monitor: "val_loss"
      interval: "epoch"
      frequency: 1
      

  eval:
    data_path: ${oc.env:eval_data_path, ./data/val}
  
  tune:
    n_trials: 10
    timeout: 7200  # in seconds

  predict:
    data_path: ./data/test

  stop_on_first_improvement:
    enabled: ${oc.decode:${oc.env:stop_on_first_improvement, false}}
    monitor: ${trainer.checkpoint.monitor}
    mode: ${trainer.checkpoint.mode}
    min_delta: 0.0

  early_stopping:
    monitor: ${trainer.checkpoint.monitor}
    mode: ${trainer.checkpoint.mode}
    patience: 0
    min_delta: 0.0

  checkpoint:
    path: ${oc.env:checkpoint_dir, ./mlflow_artifacts/checkpoints}
    filename: UnetModel-ep{epoch:02d}
    n_epochs: 1
    top_k: 1
    monitor: psnr
    mode: max