name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  # Keep in sync with TRITON_IMAGE in tests/integration/conftest.py and docker-compose.yml.
  TRITON_IMAGE: nvcr.io/nvidia/tritonserver:24.08-py3
  GATEWAY_IMAGE: fastmri-gateway:it

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The Triton image is ~15 GB unpacked; a stock runner is tight on disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Built here (with a layer cache) so tests/integration/test_image.py reuses it via GATEWAY_IMAGE.
      - name: Build gateway image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/gateway/Dockerfile
          load: true
          push: false
          tags: ${{ env.GATEWAY_IMAGE }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      # The tests skip when the image is absent, which would turn this job into a silent pass.
      - name: Pull Triton
        run: docker pull "$TRITON_IMAGE"
      - run: make setup
      - name: Integration tests (a skipped test fails the job)
        run: |
          set -o pipefail
          uv run pytest -m integration -rs -q -p no:cacheprovider 2>&1 | tee integration.log
          if grep -q '^SKIPPED' integration.log; then
            echo "::error::integration tests were skipped; Docker or an image was not available"
            exit 1
          fi
      - name: Triton and gateway container logs
        if: failure()
        run: docker ps -a --format '{{.Names}}' | xargs -r -I{} sh -c 'echo "=== {} ==="; docker logs --tail 100 {} 2>&1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: integration-log
          path: integration.log
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: make setup
      # Builds the gateway, starts mlflow/triton/gateway, registers and promotes a random-init model, runs the
      # e2e tests, and always runs `down -v` (saving compose logs to e2e-logs/ first when it failed).
      - name: make ci-e2e (a skipped test fails the job)
        env:
          PYTEST_ADDOPTS: -rs
        run: |
          set -o pipefail
          start=$(date +%s)
          make ci-e2e 2>&1 | tee e2e.log
          echo "e2e wall time: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q '^SKIPPED' e2e.log; then
            echo "::error::e2e tests were skipped; the stack was not reachable"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-logs
          path: |
            e2e-logs/
            e2e.log
          if-no-files-found: ignore
