# Serving + monitoring stack. Prerequisite: a checkpoint and its ONNX export
#   uv run python -m fastmri_knee.packaging.export --checkpoint artifacts/model.ckpt
#
#   docker compose up -d --build        # everything
#   docker compose up -d triton prometheus grafana   # one backend only
#
# Gateway :8000   Triton: no host ports by default; `make up-dev` publishes HTTP :8100 / gRPC :8101
# MLflow :5001   Prometheus :9090   Alertmanager :9093   Grafana :3000 (anonymous viewer; admin login from GF_ADMIN_PASSWORD)

x-cpu-limit: &cpu-limit
  cpus: "${SERVER_CPUS:-4}"   # CPU budget for the gateway

services:
  gateway:
    build:
      context: .
      dockerfile: deploy/gateway/Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-unknown}"
    image: fastmri-gateway:latest
    environment:
      GATEWAY_ENV: prod
      GATEWAY_TRITON_URL: triton:8001
      GATEWAY_WORKERS: "${GATEWAY_WORKERS:-2}"
      GATEWAY_MAX_INFLIGHT: "${GATEWAY_MAX_INFLIGHT:-32}"
      GATEWAY_TMP_DIR: /tmp
    secrets:
      - source: api_keys
        target: api_keys   # -> /run/secrets/api_keys; create it with `make api-key`
    read_only: true
    tmpfs:
      - /tmp:size=512m   # uploads are spooled here, so size >= max upload x concurrent requests it must hold
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      - triton
    restart: unless-stopped
    ports:
      - "8000:8000"
    <<: *cpu-limit
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  triton:
    image: "${TRITON_IMAGE:-nvcr.io/nvidia/tritonserver:24.08-py3}"
    # Explicit control mode on a (possibly empty) repository: the server comes up live, the model is
    # loaded by `make sync` (SPEC-model-packaging). Tracing flags are added with the observability work.
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
      - --load-model=unet_model
      - --strict-readiness=true
      - --exit-on-error=false
      - --metrics-config=summary_latencies=true   # p50/p90/p99 summaries on /metrics
      - --allow-metrics=true
      - --log-verbose=0
    cpus: "${TRITON_CPUS:-4}"
    mem_limit: "${TRITON_MEM:-4g}"
    shm_size: 1gb
    restart: unless-stopped
    volumes:
      - ./deploy/model_repository:/models:ro   # written only by `make sync`
    expose:
      - "8000"
      - "8001"
      - "8002"
    healthcheck:
      # live, not ready: with an empty repository the server is healthy but the model is not ready yet
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v2/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.4
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts   # clients upload over HTTP (--serve-artifacts)
      - --serve-artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle   # `curl -X POST :9090/-/reload` after editing rules
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager

  # Default receiver is alert-sink; a Slack receiver is added at start-up when SLACK_WEBHOOK_URL is set
  # (render.sh, because Alertmanager does not expand environment variables in its config).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    entrypoint: ["/bin/sh", "/etc/alertmanager/render.sh"]
    environment:
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/render.sh:/etc/alertmanager/render.sh:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      - alert-sink
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  alert-sink:
    build: ./monitoring/alert-sink
    image: fastmri-alert-sink:latest
    mem_limit: 64m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    expose:
      - "8080"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    mem_limit: 64m
    restart: unless-stopped
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command:
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 256m
    restart: unless-stopped
    expose:
      - "8080"

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    mem_limit: 384m
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.3.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Docker discovery needs the socket; :ro does not make it harmless (the API is still root-equivalent),
      # so Alloy publishes no ports beyond its own UI and runs no user-supplied config.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    mem_limit: 256m
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-change-me}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/triton-dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

secrets:
  api_keys:
    file: ./secrets/api_keys

volumes:
  mlflow_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:
