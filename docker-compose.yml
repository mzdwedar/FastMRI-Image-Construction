# Serving + monitoring stack. Prerequisite: a checkpoint and its ONNX export
#   uv run python -m fastmri_knee.packaging.export --checkpoint artifacts/model.ckpt
#
#   docker compose up -d --build        # everything
#   docker compose up -d triton prometheus grafana   # one backend only
#
# FastAPI :8000   Triton: no host ports by default; `make up-dev` publishes HTTP :8100 / gRPC :8101
# MLflow :5001   Prometheus :9090   Grafana :3000 (anonymous viewer; admin login from GF_ADMIN_PASSWORD)

x-cpu-limit: &cpu-limit
  cpus: "${SERVER_CPUS:-4}"   # both backends get the same CPU budget

services:
  fastapi:
    build:
      context: .
      dockerfile: deploy/services/fastapi/Dockerfile
    image: fastmri-fastapi:latest
    environment:
      CHECKPOINT_PATH: /artifacts/model.ckpt
      NUM_THREADS: "${SERVER_CPUS:-4}"
    volumes:
      - ./artifacts:/artifacts:ro
    ports:
      - "8000:8000"
    <<: *cpu-limit

  triton:
    image: "${TRITON_IMAGE:-nvcr.io/nvidia/tritonserver:24.08-py3}"
    # Explicit control mode on a (possibly empty) repository: the server comes up live, the model is
    # loaded by `make sync` (SPEC-model-packaging). Tracing flags are added with the observability work.
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control-mode=explicit
      - --load-model=unet_model
      - --strict-readiness=true
      - --exit-on-error=false
      - --metrics-config=summary_latencies=true   # p50/p90/p99 summaries on /metrics
      - --allow-metrics=true
      - --log-verbose=0
    cpus: "${TRITON_CPUS:-4}"
    mem_limit: "${TRITON_MEM:-4g}"
    shm_size: 1gb
    restart: unless-stopped
    volumes:
      - ./deploy/model_repository:/models:ro   # written only by `make sync`
    expose:
      - "8000"
      - "8001"
      - "8002"
    healthcheck:
      # live, not ready: with an empty repository the server is healthy but the model is not ready yet
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v2/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.4
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts   # clients upload over HTTP (--serve-artifacts)
      - --serve-artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD:-change-me}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/triton-dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mlflow_data:
  prometheus_data:
  grafana_data:
